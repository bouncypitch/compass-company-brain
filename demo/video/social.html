<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1280px;height:640px;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;-webkit-font-smoothing:antialiased;color:#1d1d1f;
background:radial-gradient(700px 420px at 8% 0%,#e3e7ff 0%,transparent 60%),radial-gradient(640px 420px at 100% 10%,#fde2f1 0%,transparent 55%),radial-gradient(760px 480px at 70% 115%,#d4f7ec 0%,transparent 60%),#fbfbfd;position:relative}
.wrap{position:absolute;left:84px;top:80px;width:640px}
.logo{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#6366f1,#ec4899);display:flex;align-items:center;justify-content:center;box-shadow:0 18px 40px -16px rgba(99,102,241,.6)}
h1{font-size:104px;letter-spacing:-.045em;margin:26px 0 0;line-height:1}
p{font-size:33px;line-height:1.25;color:#6e6e73;margin:22px 0 0;font-weight:500}
.grad{background:linear-gradient(90deg,#5b5bf0,#a050e6 50%,#e0508f);-webkit-background-clip:text;color:transparent}
.chips{position:absolute;left:84px;bottom:64px;display:flex;gap:14px}
.chip{font-size:22px;font-weight:600;padding:11px 22px;border-radius:999px;background:rgba(255,255,255,.8);border:1px solid rgba(0,0,0,.06)}
.cards{position:absolute;right:70px;top:92px;width:400px;display:flex;flex-direction:column;gap:16px}
.card{background:rgba(255,255,255,.82);border:1px solid rgba(0,0,0,.06);border-radius:24px;padding:20px 24px;box-shadow:0 20px 50px -28px rgba(15,23,42,.35)}
.k{font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:#8e8e93;font-weight:700}
.t{font-size:23px;font-weight:650;margin-top:6px;letter-spacing:-.01em}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:1px}
</style></head><body>
<div class="wrap">
  <div class="logo"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/><path d="M12 5v13"/></svg></div>
  <h1>Compass</h1>
  <p>The company brain that turns <span class="grad">market moves</span> into roadmaps — and roadmaps into <span class="grad">promotions</span>.</p>
</div>
<div class="cards">
  <div class="card"><div class="k"><span class="dot" style="background:#6366f1"></span>Market</div><div class="t">235 signals · 7 competitors</div></div>
  <div class="card"><div class="k"><span class="dot" style="background:#f43f5e"></span>Roadmap</div><div class="t">R-14 is unowned → PR drafted</div></div>
  <div class="card"><div class="k"><span class="dot" style="background:#f97316"></span>You</div><div class="t">Jordan's path to Staff</div></div>
</div>
<div class="chips"><span class="chip">HydraDB</span><span class="chip">Claude</span><span class="chip">App-Starter</span></div>
</body></html>
